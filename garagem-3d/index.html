<title>Garagem dos Sonhos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=Saira+Extra+Condensed:wght@600;800&display=swap">
<style>
/* Layout: cena 3D em tela cheia; painel de controle flutuante à esquerda, barra de câmeras embaixo. Visual único escuro (box de corrida à noite). */
:root {
  color-scheme: dark;
  --bg: #0f1114;
  --panel: rgba(16, 18, 22, 0.86);
  --line: rgba(233, 228, 214, 0.14);
  --fg: #ece8dd;
  --muted: #9b9fa7;
  --accent: #f2c230;
  --accent-ink: #1a1405;
  --display: "Saira Extra Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); overflow: hidden; }
#scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
#scene:focus { outline: none; }

.panel {
  position: fixed;
  top: calc(16px + env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px));
  width: min(320px, calc(100% - 32px));
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  padding: 16px 18px 18px;
  display: flex; flex-direction: column; gap: 14px;
  z-index: 2;
}
.eyebrow { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
h1 { margin: 2px 0 0; font-family: var(--display); font-weight: 800; font-size: 40px; line-height: 0.95; letter-spacing: 0.01em; text-transform: uppercase; text-wrap: balance; }
.specs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding-block: 10px; }
.spec b { display: block; font-family: var(--display); font-weight: 600; font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1; }
.spec span { font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.group { display: flex; flex-direction: column; gap: 6px; }
.group-label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.seg { display: flex; gap: 4px; flex-wrap: wrap; }
button {
  font: inherit; font-size: 13px; font-weight: 500; color: var(--fg);
  background: rgba(255,255,255,0.05); border: 1px solid var(--line); border-radius: 4px;
  padding: 6px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
}
button:hover { background: rgba(255,255,255,0.1); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.info { font-size: 13px; line-height: 1.45; color: var(--fg); min-height: 3.6em; }
.info strong { color: var(--accent); font-weight: 600; }
.hint { font-size: 11.5px; color: var(--muted); }
.toggle-panel { display: none; }

.views {
  position: fixed;
  left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; gap: 4px; flex-wrap: wrap; justify-content: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  padding: 6px; max-width: calc(100% - 32px); z-index: 2;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.views button { font-family: var(--display); font-weight: 600; font-size: 16px; letter-spacing: 0.06em; text-transform: uppercase; padding: 6px 12px; }

.fail { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }

@media (max-width: 640px) {
  .panel { padding: 12px 14px 14px; gap: 10px; }
  h1 { font-size: 30px; }
  .panel.collapsed .collapsible { display: none; }
  .toggle-panel { display: inline-flex; align-self: flex-start; }
  .views button { font-size: 14px; padding: 5px 9px; }
}
</style>

<canvas id="scene" tabindex="0" aria-label="Garagem 3D interativa. Arraste para girar, role ou belisque para aproximar."></canvas>

<aside class="panel" id="panel">
  <div>
    <div class="eyebrow">Projeto 3D · v0.1 · ainda sem carros</div>
    <h1>Garagem dos Sonhos</h1>
  </div>
  <button class="toggle-panel" id="togglePanel" aria-expanded="true">Esconder painel</button>
  <div class="collapsible" style="display:flex;flex-direction:column;gap:14px">
    <div class="specs">
      <div class="spec"><b>24×16</b><span>metros</span></div>
      <div class="spec"><b>6 m</b><span>pé-direito</span></div>
      <div class="spec"><b>3</b><span>vagas livres</span></div>
    </div>
    <div class="group">
      <div class="group-label">Iluminação</div>
      <div class="seg" role="group" aria-label="Iluminação">
        <button id="lightNight" aria-pressed="true">Noite</button>
        <button id="lightDay" aria-pressed="false">Dia</button>
      </div>
    </div>
    <div class="group">
      <div class="group-label">LED do simulador (bandeira)</div>
      <div class="seg" role="group" aria-label="Cor do LED">
        <button data-flag="verde" aria-pressed="true"><span class="dot" style="background:#2ee66b"></span>Verde</button>
        <button data-flag="amarela" aria-pressed="false"><span class="dot" style="background:#ffd21f"></span>Amarela</button>
        <button data-flag="azul" aria-pressed="false"><span class="dot" style="background:#2f8cff"></span>Azul</button>
      </div>
    </div>
    <div class="group">
      <div class="group-label">Plataforma giratória</div>
      <div class="seg"><button id="spin" aria-pressed="true">Girando</button></div>
    </div>
    <div class="info" id="info" aria-live="polite"></div>
    <div class="hint">Arraste para girar · role ou belisque para zoom · botão direito para mover</div>
  </div>
</aside>

<nav class="views" id="views" aria-label="Câmeras">
  <button data-view="geral" aria-pressed="true">Visão geral</button>
  <button data-view="plataforma" aria-pressed="false">Plataforma</button>
  <button data-view="simulador" aria-pressed="false">Simulador</button>
  <button data-view="oficina" aria-pressed="false">Oficina</button>
  <button data-view="elevador" aria-pressed="false">Elevador</button>
  <button data-view="lounge" aria-pressed="false">Lounge</button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  if (!window.THREE || !THREE.OrbitControls) {
    document.body.insertAdjacentHTML('beforeend', '<div class="fail">Não foi possível carregar o motor 3D. Recarregue a página.</div>');
    return;
  }
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- Renderer, cena, câmera ----------
  const canvas = document.getElementById('scene');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0d10);
  scene.fog = new THREE.Fog(0x0b0d10, 30, 60);

  const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 200);
  camera.position.set(15, 9.5, 15);
  const controls = new THREE.OrbitControls(camera, canvas);
  controls.target.set(0, 1.2, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.maxPolarAngle = Math.PI * 0.49;
  controls.minDistance = 1.5;
  controls.maxDistance = 34;

  // ---------- Helpers ----------
  const W = 24, D = 16, H = 6; // dimensões da garagem (m)
  const std = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.7, metalness: 0.05 }, o));
  function box(parent, w, h, d, mat, x, y, z) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    m.position.set(x, y, z); parent.add(m); return m;
  }
  function cyl(parent, rt, rb, h, seg, mat, x, y, z) {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
    m.position.set(x, y, z); parent.add(m); return m;
  }
  function canvasTex(w, h, draw) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d'); draw(g, w, h);
    const t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  }

  // ---------- Materiais base ----------
  const M = {
    concrete: std(0x4a4e55, { roughness: 0.9 }),
    darkMetal: std(0x2a2d33, { roughness: 0.45, metalness: 0.5 }),
    alu: std(0x9aa1aa, { roughness: 0.35, metalness: 0.6 }),
    black: std(0x141518, { roughness: 0.6 }),
    rubber: std(0x0f0f10, { roughness: 0.95 }),
    red: std(0xc8221f, { roughness: 0.4, metalness: 0.2 }),
    yellow: std(0xf2c230, { roughness: 0.5 }),
    wood: std(0x5a3a24, { roughness: 0.75 }),
    leather: std(0x7a4426, { roughness: 0.55 }),
    white: std(0xe9e6df, { roughness: 0.5 }),
    led: new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide }),
  };

  // ---------- Piso epóxi com marcações ----------
  const S = 64;
  const floorTex = canvasTex(W * S, D * S, (g, w, h) => {
    g.fillStyle = '#2a2c31'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 9000; i++) {
      g.fillStyle = `rgba(${Math.random() < 0.5 ? '255,255,255' : '0,0,0'},${Math.random() * 0.08})`;
      g.fillRect(Math.random() * w, Math.random() * h, 2, 2);
    }
    const P = (x, z) => [(x + W / 2) * S, (z + D / 2) * S];
    const yellow = '#e9b92e';
    g.strokeStyle = yellow; g.lineWidth = 0.1 * S;
    // contorno de segurança
    g.setLineDash([]);
    g.strokeRect(...P(-11.6, -7.6), 23.2 * S, 15.2 * S);
    // Vaga 01 (elevador)
    g.strokeRect(...P(-10, -7.4), 5.8 * S, 6.2 * S);
    // Vaga 02 (dia a dia)
    g.strokeRect(...P(3.4, 1.4), 6.6 * S, 6.0 * S);
    // círculo tracejado da plataforma
    g.setLineDash([0.5 * S, 0.3 * S]);
    g.beginPath(); g.arc(...P(0, 0), 3.15 * S, 0, Math.PI * 2); g.stroke();
    g.setLineDash([]);
    // zona zebrada na frente da bancada
    g.save();
    const [zx, zy] = P(10.0, -6.6);
    g.beginPath(); g.rect(zx, zy, 1.1 * S, 5.4 * S); g.clip();
    g.fillStyle = 'rgba(233,185,46,0.85)';
    for (let i = -10; i < 20; i++) { g.save(); g.translate(zx + i * 0.5 * S, zy); g.rotate(Math.PI / 4); g.fillRect(0, -2000, 0.18 * S, 4000); g.restore(); }
    g.restore();
    // textos
    g.fillStyle = yellow; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = `700 ${0.55 * S}px "Saira Extra Condensed", "Arial Narrow", sans-serif`;
    g.fillText('VAGA 01 · ELEVADOR', ...P(-7.1, -0.6));
    g.fillText('VAGA 02 · DIA A DIA', ...P(6.7, 7.0));
    g.fillText('RESERVADO · CARRO PRINCIPAL', ...P(0, 3.75));
    g.font = `700 ${0.4 * S}px "Saira Extra Condensed", "Arial Narrow", sans-serif`;
    g.fillText('SIM RIG', ...P(4.5, -3.6));
    // seta de entrada
    g.fillStyle = 'rgba(233,233,226,0.55)';
    const [ax, ay] = P(0, 6.6);
    g.beginPath(); g.moveTo(ax, ay - 0.6 * S); g.lineTo(ax - 0.5 * S, ay); g.lineTo(ax - 0.2 * S, ay); g.lineTo(ax - 0.2 * S, ay + 0.6 * S);
    g.lineTo(ax + 0.2 * S, ay + 0.6 * S); g.lineTo(ax + 0.2 * S, ay); g.lineTo(ax + 0.5 * S, ay); g.closePath(); g.fill();
  });
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, D), std(0xffffff, { map: floorTex, roughness: 0.32, metalness: 0.08 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

  // ---------- Paredes ----------
  const brickTex = canvasTex(512, 256, (g, w, h) => {
    g.fillStyle = '#3a2a24'; g.fillRect(0, 0, w, h);
    const bw = 64, bh = 32;
    for (let r = 0; r < h / bh; r++) {
      for (let c = -1; c < w / bw + 1; c++) {
        const x = c * bw + (r % 2 ? bw / 2 : 0);
        const v = 0.75 + Math.random() * 0.35;
        g.fillStyle = `rgb(${Math.floor(128 * v)},${Math.floor(62 * v)},${Math.floor(46 * v)})`;
        g.fillRect(x + 3, r * bh + 3, bw - 6, bh - 6);
      }
    }
  });
  brickTex.wrapS = brickTex.wrapT = THREE.RepeatWrapping; brickTex.repeat.set(12, 6);
  const backWall = new THREE.Mesh(new THREE.PlaneGeometry(W, H), std(0xffffff, { map: brickTex, roughness: 0.92 }));
  backWall.position.set(0, H / 2, -D / 2); scene.add(backWall);

  // parede esquerda: ripado de madeira
  const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(D, H), std(0x1a1512));
  leftWall.rotation.y = Math.PI / 2; leftWall.position.set(-W / 2, H / 2, 0); scene.add(leftWall);
  const slatCount = Math.floor(D / 0.2);
  const slats = new THREE.InstancedMesh(new THREE.BoxGeometry(0.06, H, 0.11), M.wood, slatCount);
  const dummy = new THREE.Object3D();
  for (let i = 0; i < slatCount; i++) { dummy.position.set(-W / 2 + 0.04, H / 2, -D / 2 + 0.1 + i * 0.2); dummy.updateMatrix(); slats.setMatrixAt(i, dummy.matrix); }
  slats.receiveShadow = true; scene.add(slats);

  // parede direita: concreto
  const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(D, H), M.concrete);
  rightWall.rotation.y = -Math.PI / 2; rightWall.position.set(W / 2, H / 2, 0); scene.add(rightWall);

  // frente: portão de vidro com caixilhos
  const front = new THREE.Group(); front.position.z = D / 2; scene.add(front);
  const doorW = 10, doorH = 4.6;
  box(front, (W - doorW) / 2, H, 0.3, M.concrete, -(W + doorW) / 4, H / 2, 0);
  box(front, (W - doorW) / 2, H, 0.3, M.concrete, (W + doorW) / 4, H / 2, 0);
  box(front, doorW, H - doorH, 0.3, M.concrete, 0, doorH + (H - doorH) / 2, 0);
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(doorW, doorH), new THREE.MeshStandardMaterial({ color: 0xa9bccb, transparent: true, opacity: 0.16, roughness: 0.1, metalness: 0.2, side: THREE.DoubleSide }));
  glass.position.set(0, doorH / 2, 0); front.add(glass);
  for (let i = 0; i <= 6; i++) box(front, doorW, 0.06, 0.08, M.darkMetal, 0, (doorH / 6) * i, 0);
  [-doorW / 2, 0, doorW / 2].forEach(x => box(front, 0.08, doorH, 0.1, M.darkMetal, x, doorH / 2, 0));

  // ---------- Teto, treliças e LEDs hexagonais ----------
  const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(W, D), std(0x15171b, { roughness: 1 }));
  ceiling.rotation.x = Math.PI / 2; ceiling.position.y = H; scene.add(ceiling);
  [-6, -2, 2, 6].forEach(z => {
    box(scene, W, 0.08, 0.08, M.darkMetal, 0, 5.45, z);
    box(scene, W, 0.08, 0.08, M.darkMetal, 0, 5.95, z);
    for (let x = -W / 2; x < W / 2; x += 1) {
      const diag = box(scene, 0.04, Math.hypot(1, 0.5), 0.04, M.darkMetal, x + 0.5, 5.7, z);
      diag.rotation.z = ((x + 12) % 2 ? 1 : -1) * Math.atan2(1, 0.5);
    }
  });
  const hexGroup = new THREE.Group(); scene.add(hexGroup);
  function hexCluster(cx, cz, rings, R) {
    const step = R + 0.05;
    for (let q = -rings; q <= rings; q++) {
      for (let r = Math.max(-rings, -q - rings); r <= Math.min(rings, -q + rings); r++) {
        const x = cx + step * 1.5 * q;
        const z = cz + step * Math.sqrt(3) * (r + q / 2);
        const ring = new THREE.Mesh(new THREE.RingGeometry(R - 0.06, R, 6), M.led);
        ring.rotation.x = Math.PI / 2; ring.position.set(x, 5.35, z); hexGroup.add(ring);
      }
    }
    const p = new THREE.PointLight(0xfff4e6, 0.55, 16, 2); p.position.set(cx, 5.0, cz); scene.add(p);
    return p;
  }
  const ceilingLights = [
    hexCluster(0, 0, 2, 0.6),
    hexCluster(-7.2, -4.2, 1, 0.55),
    hexCluster(7.5, -4.2, 1, 0.55),
    hexCluster(-8.6, 4.4, 1, 0.55),
    hexCluster(6.7, 4.4, 1, 0.55),
  ];
  const keySpot = new THREE.SpotLight(0xfff1dc, 1.4, 22, Math.PI / 4.2, 0.55, 1.5);
  keySpot.position.set(0, 5.8, 0.5); keySpot.target.position.set(0, 0, 0);
  keySpot.castShadow = true; keySpot.shadow.mapSize.set(2048, 2048); keySpot.shadow.bias = -0.0004;
  scene.add(keySpot, keySpot.target);

  const hemi = new THREE.HemisphereLight(0xcfd6e0, 0x2a2420, 0.28); scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff0d8, 0); sun.position.set(-6, 9, 22); sun.target.position.set(0, 0, 0);
  sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 12, bottom: -12, near: 1, far: 50 });
  scene.add(sun, sun.target);

  // ---------- Plataforma giratória (vazia) ----------
  const turntable = new THREE.Group(); scene.add(turntable);
  const ttTex = canvasTex(1024, 1024, (g, w, h) => {
    g.fillStyle = '#1d1f23'; g.fillRect(0, 0, w, h);
    g.strokeStyle = 'rgba(255,255,255,0.08)'; g.lineWidth = 3;
    for (let i = 0; i < 48; i++) { const a = (i / 48) * Math.PI * 2; g.beginPath(); g.moveTo(w / 2, h / 2); g.lineTo(w / 2 + Math.cos(a) * w, h / 2 + Math.sin(a) * h); g.stroke(); }
    for (let r = 120; r < 512; r += 120) { g.beginPath(); g.arc(w / 2, h / 2, r, 0, Math.PI * 2); g.stroke(); }
    g.fillStyle = '#f2c230'; g.font = '700 64px "Saira Extra Condensed", "Arial Narrow", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('24', w / 2, h / 2);
  });
  const ttTop = new THREE.Mesh(new THREE.CylinderGeometry(2.6, 2.6, 0.12, 96), [std(0x2a2c30, { metalness: 0.5, roughness: 0.4 }), std(0xffffff, { map: ttTex, roughness: 0.35, metalness: 0.3 }), M.black]);
  ttTop.position.y = 0.06; ttTop.receiveShadow = true; turntable.add(ttTop);
  const ttRing = new THREE.Mesh(new THREE.TorusGeometry(2.62, 0.025, 8, 128), new THREE.MeshBasicMaterial({ color: 0xf2c230 }));
  ttRing.rotation.x = Math.PI / 2; ttRing.position.y = 0.1; scene.add(ttRing);

  // ---------- Elevador de 4 colunas (vaga 01) ----------
  const lift = new THREE.Group(); lift.position.set(-7.1, 0, -4.3); scene.add(lift);
  [[-2.4, -2.5], [2.4, -2.5], [-2.4, 2.5], [2.4, 2.5]].forEach(([x, z]) => {
    box(lift, 0.3, 2.7, 0.3, M.red, x, 1.35, z);
    box(lift, 0.5, 0.04, 0.5, M.darkMetal, x, 0.02, z);
  });
  box(lift, 5.1, 0.18, 0.3, M.darkMetal, 0, 1.9, -2.5);
  box(lift, 5.1, 0.18, 0.3, M.darkMetal, 0, 1.9, 2.5);
  [-1.05, 1.05].forEach(x => {
    box(lift, 0.55, 0.12, 5.0, M.alu, x, 2.05, 0);
    const ramp = box(lift, 0.55, 0.06, 1.0, M.alu, x, 1.82, 2.95); ramp.rotation.x = 0.45;
  });

  // ---------- Sim rig + TV de telemetria ----------
  const rig = new THREE.Group(); rig.position.set(4.5, 0, -5.0); scene.add(rig);
  [-0.38, 0.38].forEach(x => box(rig, 0.08, 0.08, 2.0, M.alu, x, 0.04, 0));
  [-0.9, 0, 0.8].forEach(z => box(rig, 0.84, 0.08, 0.08, M.alu, 0, 0.04, z));
  [-0.38, 0.38].forEach(x => box(rig, 0.08, 0.75, 0.08, M.alu, x, 0.4, -0.7));
  box(rig, 0.84, 0.05, 0.28, M.alu, 0, 0.78, -0.7);
  box(rig, 0.16, 0.16, 0.22, M.black, 0, 0.9, -0.62); // base direct drive
  const wheel = new THREE.Mesh(new THREE.TorusGeometry(0.16, 0.022, 12, 40), M.black);
  wheel.position.set(0, 0.98, -0.48); wheel.rotation.x = -0.25; rig.add(wheel);
  box(rig, 0.18, 0.1, 0.03, M.darkMetal, 0, 0.98, -0.47).rotation.x = -0.25;
  [-0.18, 0, 0.18].forEach(x => { const p = box(rig, 0.08, 0.2, 0.02, M.alu, x, 0.16, -0.85); p.rotation.x = -0.5; });
