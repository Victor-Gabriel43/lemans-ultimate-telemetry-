<title>Galeria Corsa 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: cena 3D em tela cheia; painel discreto à esquerda (cenas de luz e qualidade) e barra de câmeras embaixo. Visual único escuro, igual ao caderno de projeto. */
:root {
  color-scheme: dark;
  --ink: #0b0a09;
  --panel: rgba(15, 14, 13, 0.84);
  --rule: rgba(232, 226, 214, 0.14);
  --fg: #e8e2d6;
  --muted: #9b9285;
  --light: #e3a75f;
  --light-ink: #1c1206;
  --display: "Marcellus", "Trajan Pro", Georgia, serif;
  --body: "Manrope", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--fg); font-family: var(--body); overflow: hidden; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#scene:focus { outline: none; }
.panel {
  position: fixed; z-index: 2;
  top: calc(16px + env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px));
  width: min(300px, calc(100% - 32px));
  background: var(--panel); border: 1px solid var(--rule);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  padding: 16px 18px; display: flex; flex-direction: column; gap: 14px;
}
.eyebrow, .glabel { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; }
.eyebrow { color: var(--light); }
.glabel { color: var(--muted); }
h1 { margin: 4px 0 0; font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1; letter-spacing: 0.05em; text-transform: uppercase; }
.meta { font-family: var(--mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.group { display: flex; flex-direction: column; gap: 6px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
button {
  font: inherit; font-size: 12.5px; font-weight: 500; color: var(--fg);
  background: transparent; border: 1px solid var(--rule); padding: 6px 10px; cursor: pointer;
}
button:hover { border-color: rgba(232, 226, 214, 0.4); }
button:focus-visible { outline: 2px solid var(--light); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--light); color: var(--light-ink); border-color: var(--light); }
.info { font-size: 13px; line-height: 1.5; min-height: 4.5em; }
.info b { font-weight: 600; color: var(--light); }
.hint { font-size: 11.5px; color: var(--muted); }
.toggle { display: none; align-self: flex-start; }
.views {
  position: fixed; z-index: 2; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  max-width: calc(100% - 32px);
  display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; padding: 6px;
  background: var(--panel); border: 1px solid var(--rule);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.views button { font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; }
.fail { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }
@media (max-width: 640px) {
  .panel { padding: 12px 14px; gap: 10px; }
  h1 { font-size: 26px; }
  .panel.collapsed .more { display: none; }
  .toggle { display: inline-block; }
}
</style>

<canvas id="scene" tabindex="0" aria-label="Galeria Corsa em 3D. Arraste para girar, role ou belisque para aproximar."></canvas>

<aside class="panel" id="panel">
  <div>
    <div class="eyebrow">Estudo 3D · vagas vazias</div>
    <h1>Galeria Corsa</h1>
  </div>
  <div class="meta">16 × 54 m · pé-direito 7,20 m · 14 + 1 vagas</div>
  <button class="toggle" id="toggle" aria-expanded="true">Esconder painel</button>
  <div class="more" style="display:flex;flex-direction:column;gap:14px">
    <div class="group">
      <div class="glabel">Cena de luz</div>
      <div class="seg" role="group" aria-label="Cena de luz">
        <button data-scene="galeria" aria-pressed="true">Galeria</button>
        <button data-scene="clube" aria-pressed="false">Noite de clube</button>
        <button data-scene="cinema" aria-pressed="false">Cinema</button>
        <button data-scene="servico" aria-pressed="false">Serviço</button>
      </div>
    </div>
    <div class="group">
      <div class="glabel">Reflexos (piso e espelho)</div>
      <div class="seg" role="group" aria-label="Reflexos">
        <button id="reflOn" aria-pressed="true">Ligados</button>
        <button id="reflOff" aria-pressed="false">Desligados (mais leve)</button>
      </div>
    </div>
    <div class="info" id="info" aria-live="polite"></div>
    <div class="hint">Arraste para girar · role ou belisque para zoom · botão direito ou dois dedos para mover</div>
  </div>
</aside>

<nav class="views" id="views" aria-label="Câmeras">
  <button data-view="chegada" aria-pressed="true">Chegada</button>
  <button data-view="galeria" aria-pressed="false">Galeria</button>
  <button data-view="rotunda" aria-pressed="false">Rotunda</button>
  <button data-view="bar" aria-pressed="false">Bar</button>
  <button data-view="lounge" aria-pressed="false">Lounge</button>
  <button data-view="escritorio" aria-pressed="false">Escritório</button>
  <button data-view="aerea" aria-pressed="false">Aérea</button>
  <button id="tour" aria-pressed="false">Tour</button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Reflector.js"></script>
<script>
(function () {
  if (!window.THREE || !THREE.OrbitControls) {
    document.body.insertAdjacentHTML('beforeend', '<div class="fail">Não foi possível carregar o motor 3D. Recarregue a página.</div>');
    return;
  }
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const W = 16, L = 54, H = 7.2;          // largura (x), comprimento (z), pé-direito
  const ZF = L / 2, ZB = -L / 2;          // frente (entrada) e fundo
  const CEIL = 6.6;                        // forro de madeira lateral
  const MEZ = 3.6;                         // nível do mezanino

  // ---------- renderer ----------
  const canvas = document.getElementById('scene');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050505);
  const camera = new THREE.PerspectiveCamera(55, 1, 0.05, 200);
  const controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.minDistance = 0.4; controls.maxDistance = 70;
  controls.maxPolarAngle = Math.PI * 0.495;

  // ---------- helpers ----------
  const std = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.7, metalness: 0.05 }, o));
  const basic = (color, o = {}) => new THREE.MeshBasicMaterial(Object.assign({ color }, o));
  function box(p, w, h, d, m, x, y, z) { const e = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); e.position.set(x, y, z); p.add(e); return e; }
  function cyl(p, rt, rb, h, s, m, x, y, z) { const e = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, s), m); e.position.set(x, y, z); p.add(e); return e; }
  function plane(p, w, h, m, x, y, z, rx = 0, ry = 0) { const e = new THREE.Mesh(new THREE.PlaneGeometry(w, h), m); e.position.set(x, y, z); e.rotation.set(rx, ry, 0); p.add(e); return e; }
  function tex(w, h, draw, repeat) {
    const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
    return t;
  }
  const rnd = (a, b) => a + Math.random() * (b - a);

  // ---------- materiais ----------
  const M = {
    wallDark: std(0x1a1a1b, { roughness: 0.9 }),
    black: std(0x0e0e0f, { roughness: 0.45, metalness: 0.4 }),
    steelWhite: std(0xcfcbc2, { roughness: 0.6 }),
    oak: std(0xb38a5c, { roughness: 0.55 }),
    walnut: std(0x3b2417, { roughness: 0.6 }),
    stone: std(0x2a2a2b, { roughness: 0.3, metalness: 0.1 }),
    bronze: std(0x6b5a45, { roughness: 0.35, metalness: 0.75 }),
    leather: std(0x6e3a20, { roughness: 0.5 }),
    boucle: std(0x6d6258, { roughness: 0.95 }),
    glass: new THREE.MeshStandardMaterial({ color: 0x9fb6c0, transparent: true, opacity: 0.12, roughness: 0.05, metalness: 0.3, depthWrite: false, side: THREE.DoubleSide }),
  };

  // camadas de luz controladas pelas cenas
  const L1 = [];   // spots dos carros
  const L2 = [];   // arcos de luz (materiais aditivos)
  const L3 = [];   // linhas 2700K: {mat, base}
  const L3glow = [];
  const L4 = [];   // luzes do clube
  const lineMat = () => { const m = basic(0xd9782a); L3.push({ m, base: new THREE.Color(0xd9782a) }); return m; };

  // ---------- texturas ----------
  const S = 32;
  const concreteTex = tex(W * S, L * S, (g, w, h) => {
    g.fillStyle = '#9a978f'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 1800; i++) {
      const r = rnd(6, 60); const x = rnd(0, w), y = rnd(0, h);
      const gr = g.createRadialGradient(x, y, 0, x, y, r);
      const c = Math.random() < 0.5 ? '255,255,250' : '60,58,55';
      gr.addColorStop(0, `rgba(${c},${rnd(0.03, 0.09)})`); gr.addColorStop(1, `rgba(${c},0)`);
      g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
    }
    for (let i = 0; i < 9000; i++) { g.fillStyle = `rgba(40,38,36,${rnd(0.05, 0.2)})`; g.fillRect(rnd(0, w), rnd(0, h), 1, 1); }
    // juntas serradas: modulação de 3,20 m na galeria e eixos longitudinais
    g.strokeStyle = 'rgba(50,48,45,0.55)'; g.lineWidth = 1.4;
    const zpx = z => (z + L / 2) * S;
    for (let z = 20.2; z >= -2.3; z -= 3.2) { g.beginPath(); g.moveTo(0, zpx(z)); g.lineTo(w, zpx(z)); g.stroke(); }
    [-2.6, 2.6].forEach(x => { g.beginPath(); g.moveTo((x + 8) * S, 0); g.lineTo((x + 8) * S, h); g.stroke(); });
  });
  const walnutTex = tex(512, 512, (g, w, h) => {
    g.fillStyle = '#3a2416'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 400; i++) { g.strokeStyle = `rgba(${Math.random() < 0.5 ? '90,58,36' : '25,15,9'},${rnd(0.1, 0.35)})`; g.lineWidth = rnd(0.5, 2); const y = rnd(0, h); g.beginPath(); g.moveTo(0, y); g.bezierCurveTo(w * 0.3, y + rnd(-6, 6), w * 0.6, y + rnd(-6, 6), w, y + rnd(-4, 4)); g.stroke(); }
    g.fillStyle = 'rgba(0,0,0,0.75)'; g.fillRect(0, 0, w, 6); g.fillRect(0, 0, 6, h);
  }, [5, 45]);
  const deckTex = tex(64, 64, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0, '#2d2f31'); gr.addColorStop(0.5, '#45474a'); gr.addColorStop(1, '#2a2b2d');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
  }, [4, 180]);
  const flutedTex = tex(128, 64, (g, w, h) => {
    for (let i = 0; i < 4; i++) {
      const gr = g.createLinearGradient(i * 32, 0, i * 32 + 32, 0);
      gr.addColorStop(0, '#1b1c1e'); gr.addColorStop(0.45, '#3a3c3f'); gr.addColorStop(0.55, '#34363a'); gr.addColorStop(1, '#151618');
      g.fillStyle = gr; g.fillRect(i * 32, 0, 32, h);
    }
  }, [L / 0.2 / 4, 1]);
  const scallopTex = tex(256, 512, (g, w, h) => {
    g.save(); g.translate(w / 2, -40); g.scale(1, 2.6);
    const gr = g.createRadialGradient(0, 0, 4, 0, 0, w * 0.55);
    gr.addColorStop(0, 'rgba(255,220,170,1)'); gr.addColorStop(0.35, 'rgba(255,200,140,0.55)');
    gr.addColorStop(0.8, 'rgba(255,190,130,0.12)'); gr.addColorStop(1, 'rgba(255,190,130,0)');
    g.fillStyle = gr; g.fillRect(-w, 0, w * 2, h); g.restore();
  });
  const glowVTex = tex(16, 256, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0, 'rgba(255,190,120,1)'); gr.addColorStop(0.25, 'rgba(255,170,100,0.45)'); gr.addColorStop(1, 'rgba(255,170,100,0)');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
  });
  const radialTex = tex(128, 128, (g, w) => {
    const gr = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
    gr.addColorStop(0, 'rgba(255,225,185,1)'); gr.addColorStop(0.4, 'rgba(255,200,150,0.35)'); gr.addColorStop(1, 'rgba(255,200,150,0)');
    g.fillStyle = gr; g.fillRect(0, 0, w, w);
  });
  const marbleTex = tex(512, 256, (g, w, h) => {
    g.fillStyle = '#2b2b2d'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 40; i++) { g.strokeStyle = `rgba(200,198,192,${rnd(0.05, 0.25)})`; g.lineWidth = rnd(0.5, 2.2); g.beginPath(); let x = rnd(0, w), y = 0; g.moveTo(x, y); while (y < h) { x += rnd(-18, 18); y += rnd(10, 30); g.lineTo(x, y); } g.stroke(); }
  });
  function artTex(seed) {
    return tex(512, 340, (g, w, h) => {
      g.fillStyle = '#0d0d0e'; g.fillRect(0, 0, w, h);
      const hues = [['#a31812', '#e24a2c'], ['#7a7f86', '#d9d6cf'], ['#b3871f', '#f0c968']][seed % 3];
      for (let i = 0; i < 7; i++) {
        g.strokeStyle = i % 2 ? hues[0] : hues[1]; g.lineWidth = 2 + i * 1.5; g.globalAlpha = 0.85 - i * 0.08;
        g.beginPath(); g.moveTo(-20, h * (0.75 - i * 0.03)); g.bezierCurveTo(w * 0.3, h * (0.2 + seed * 0.05 + i * 0.02), w * 0.65, h * (0.95 - i * 0.04), w + 20, h * (0.35 + i * 0.03)); g.stroke();
      }
      g.globalAlpha = 1;
    });
  }
  function plaqueTex(n) {
    return tex(256, 160, (g, w, h) => {
      g.fillStyle = '#0c0c0d'; g.fillRect(0, 0, w, h);
      g.strokeStyle = '#6b5a45'; g.lineWidth = 3; g.strokeRect(6, 6, w - 12, h - 12);
      g.fillStyle = '#e8e2d6'; g.font = '600 34px "Manrope", sans-serif'; g.fillText('VAGA ' + String(n).padStart(2, '0'), 22, 58);
      g.fillStyle = '#9b9285'; g.font = '400 18px "IBM Plex Mono", monospace';
      g.fillText('reservada', 22, 92); g.fillText('3,20 × 5,40 m', 22, 120);
    });
  }

  // ---------- piso ----------
  let floorMirror = null, wallMirror = null;
  if (THREE.Reflector) {
    floorMirror = new THREE.Reflector(new THREE.PlaneGeometry(W, L), { clipBias: 0.003, textureWidth: 1024, textureHeight: 2048, color: 0xb0b0b0 });
    floorMirror.rotation.x = -Math.PI / 2; scene.add(floorMirror);
  }
  const floorMat = std(0xffffff, { map: concreteTex, roughness: 0.28, metalness: 0.0, transparent: true, opacity: 0.8 });
  const floor = plane(scene, W, L, floorMat, 0, 0.004, 0, -Math.PI / 2);

  // ---------- paredes ----------
  const walls = { north: new THREE.Group(), south: new THREE.Group(), front: new THREE.Group(), back: new THREE.Group() };
  Object.values(walls).forEach(g => scene.add(g));
  // norte (x = -8): parede escura + espelho fumê sobre rodapé de carvalho
  plane(walls.north, L, H, M.wallDark, -W / 2, H / 2, 0, 0, Math.PI / 2);
  const mirrorZ0 = 21, mirrorZ1 = -9, mirrorLen = mirrorZ0 - mirrorZ1;
  if (THREE.Reflector) {
    wallMirror = new THREE.Reflector(new THREE.PlaneGeometry(mirrorLen, CEIL - 1.15), { clipBias: 0.003, textureWidth: 2048, textureHeight: 512, color: 0x3d3d3d });
    wallMirror.rotation.y = Math.PI / 2; wallMirror.position.set(-W / 2 + 0.04, 1.15 + (CEIL - 1.15) / 2, (mirrorZ0 + mirrorZ1) / 2);
    walls.north.add(wallMirror);
  }
  const mirrorFallback = plane(walls.north, mirrorLen, CEIL - 1.15, std(0x0c0d0e, { roughness: 0.08, metalness: 0.9 }), -W / 2 + 0.035, 1.15 + (CEIL - 1.15) / 2, (mirrorZ0 + mirrorZ1) / 2, 0, Math.PI / 2);
  // rodapé de carvalho com tampa e LED
  box(walls.north, 0.38, 1.1, mirrorLen, M.oak, -W / 2 + 0.2, 0.55, (mirrorZ0 + mirrorZ1) / 2);
  box(walls.north, 0.44, 0.05, mirrorLen, M.stone, -W / 2 + 0.22, 1.125, (mirrorZ0 + mirrorZ1) / 2);
  box(walls.north, 0.02, 0.02, mirrorLen, lineMat(), -W / 2 + 0.43, 1.085, (mirrorZ0 + mirrorZ1) / 2);
  {
    const gm = basic(0xffffff, { map: glowVTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.9 });
    L3glow.push(gm);
    plane(walls.north, mirrorLen, 0.9, gm, -W / 2 + 0.395, 0.62, (mirrorZ0 + mirrorZ1) / 2, 0, Math.PI / 2);
    const fg = basic(0xffffff, { map: glowVTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.35 });
    L3glow.push(fg);
    const fl = plane(walls.north, mirrorLen, 0.9, fg, -W / 2 + 0.85, 0.008, (mirrorZ0 + mirrorZ1) / 2, -Math.PI / 2, 0);
    fl.rotation.set(-Math.PI / 2, 0, Math.PI / 2);
  }
  // tomadas técnicas no rodapé
  for (let z = 18.6; z > -2.5; z -= 3.2) box(walls.north, 0.01, 0.08, 0.12, M.black, -W / 2 + 0.395, 0.25, z);

  // sul (x = +8): canelado grafite com arcos de luz, quadros e nichos
  plane(walls.south, L, H, std(0xffffff, { map: flutedTex, roughness: 0.55, metalness: 0.35 }), W / 2, H / 2, 0, 0, -Math.PI / 2);
  const scallopMat = basic(0xffffff, { map: scallopTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.75 });
  L2.push(scallopMat);
  for (let z = 25.8; z > -26.5; z -= 1.2) {
    if (z < -14.6 && z > -21.2) continue; // mezanino
    const top = z < -14.6 ? MEZ - 0.15 : CEIL;
    const hgt = z < -14.6 ? 2.6 : 3.8;
    plane(walls.south, 1.05, hgt, scallopMat, W / 2 - 0.02, top - hgt / 2, z, 0, -Math.PI / 2);
    cyl(walls.south, 0.05, 0.05, 0.02, 12, basic(0xfff0dc), W / 2 - 0.3, top - 0.005, z);
  }
  // quadros
  [[17.0, 0], [10.6, 1], [4.2, 2], [-2.2, 0]].forEach(([z, s]) => {
    box(walls.south, 0.06, 1.35, 2.1, M.black, W / 2 - 0.05, 2.55, z);
    plane(walls.south, 2.0, 1.25, std(0xffffff, { map: artTex(s), roughness: 0.6 }), W / 2 - 0.085, 2.55, z, 0, -Math.PI / 2);
  });
  // nichos retroiluminados com miniaturas
  [13.8, 7.4, 1.0].forEach(z => {
    box(walls.south, 0.32, 1.1, 1.6, M.black, W / 2 - 0.16, 2.6, z);
    const back = plane(walls.south, 1.5, 1.0, basic(0xffffff, { map: radialTex, transparent: true }), W / 2 - 0.3, 2.6, z, 0, -Math.PI / 2);
    L3glow.push(back.material);
    [2.25, 2.75].forEach(y => {
      box(walls.south, 0.3, 0.02, 1.5, M.glass, W / 2 - 0.16, y, z);
      [-0.45, 0, 0.45].forEach((dz, i) => box(walls.south, 0.09, 0.05, 0.2, std([0xa31812, 0xd9d6cf, 0xb3871f][i], { roughness: 0.2, metalness: 0.3 }), W / 2 - 0.16, y + 0.04, z + dz));
    });
  });

  // frente (entrada) com portão de vidro pivotante
  const doorW = 5, doorH = 4.2;
  box(walls.front, (W - doorW) / 2, H, 0.3, M.wallDark, -(W + doorW) / 4, H / 2, ZF);
  box(walls.front, (W - doorW) / 2, H, 0.3, M.wallDark, (W + doorW) / 4, H / 2, ZF);
  box(walls.front, doorW, H - doorH, 0.3, M.wallDark, 0, doorH + (H - doorH) / 2, ZF);
  plane(walls.front, doorW, doorH, M.glass, 0, doorH / 2, ZF);
  box(walls.front, doorW, 0.06, 0.08, M.black, 0, doorH, ZF);
  box(walls.front, 0.06, doorH, 0.08, M.black, -doorW / 2, doorH / 2, ZF);
  box(walls.front, 0.06, doorH, 0.08, M.black, doorW / 2, doorH / 2, ZF);

  const views = {
    chegada: { pos: [0.4, 1.65, 25.6], target: [0, 1.7, 0], info: 'Da porta de vidro: o eixo da galeria termina na rotunda e no mezanino iluminado.' },
    galeria: { pos: [-1.2, 1.05, 15.5], target: [4.6, 1.5, 9.5], info: 'Vagas de 3,20 m com placa técnica, spots no trilho e arcos de luz na parede canelada.' },
    rotunda: { pos: [3.6, 1.7, 0.6], target: [0, 0.6, -6], info: 'Plataforma Ø5,5 m para o carro principal, sob o anel de luz do forro circular.' },
    bar: { pos: [-1.6, 1.65, -9.2], target: [-6.6, 1.6, -14.2], info: 'Balcão de mármore escuro de 7,2 m, seis banquetas e cristaleira retroiluminada.' },
    lounge: { pos: [0.3, 1.35, -11.2], target: [0, 1.6, -21], info: 'Sofá em L de couro, poltronas de bouclé e tela de 5 m, sob o mezanino de 3,40 m.' },
    escritorio: { pos: [0.2, MEZ + 1.5, -17.8], target: [0, 1.6, 6], info: 'Do escritório envidraçado no mezanino: a vista para a coleção inteira.' },
    aerea: { pos: [21, 30, 34], target: [0, 0, -2], info: 'Corte sem teto: chegada, galeria, rotunda, clube e serviço em um único eixo.' },
  };
  let currentView = null, goal = null;
  function setView(name, instant) {
    currentView = name; const v = views[name];
    document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === name)));
    goal = { pos: new THREE.Vector3(...v.pos), target: new THREE.Vector3(...v.target) };
    if (instant || reduceMotion) { camera.position.copy(goal.pos); controls.target.copy(goal.target); goal = null; }
    applyScene(currentScene);
  }
  document.getElementById('views').addEventListener('click', e => { const b = e.target.closest('[data-view]'); if (b) { stopTour(); setView(b.dataset.view); } });
  controls.addEventListener('start', () => { goal = null; stopTour(); });

  let tourTimer = null; const tourOrder = ['chegada', 'galeria', 'rotunda', 'bar', 'lounge', 'escritorio', 'aerea'];
  const tourBtn = document.getElementById('tour');
  function stopTour() { if (tourTimer) { clearInterval(tourTimer); tourTimer = null; tourBtn.setAttribute('aria-pressed', 'false'); } }
  tourBtn.addEventListener('click', () => {
    if (tourTimer) { stopTour(); return; }
    tourBtn.setAttribute('aria-pressed', 'true');
    let i = Math.max(0, tourOrder.indexOf(currentView));
    const step = () => { i = (i + 1) % tourOrder.length; setView(tourOrder[i]); document.querySelector('[data-view="' + tourOrder[i] + '"]').setAttribute('aria-pressed', 'true'); };
    step(); tourTimer = setInterval(step, 6500);
  });

  const panel = document.getElementById('panel'), tgl = document.getElementById('toggle');
  tgl.addEventListener('click', () => { const c = panel.classList.toggle('collapsed'); tgl.textContent = c ? 'Mostrar painel' : 'Esconder painel'; tgl.setAttribute('aria-expanded', String(!c)); });
  if (innerWidth <= 640) { panel.classList.add('collapsed'); tgl.textContent = 'Mostrar painel'; tgl.setAttribute('aria-expanded', 'false'); }

  // ---------- loop ----------
  function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
  addEventListener('resize', resize); resize();
  setReflections(innerWidth > 700);
  setView('chegada', true);

  const clock = new THREE.Clock();
  function frame() {
    const dt = Math.min(clock.getDelta(), 0.1);
    if (!reduceMotion) { fans.forEach(f => f.rotation.y += dt * 0.9); turntable.rotation.y += dt * 0.12; }
    if (goal) {
      camera.position.lerp(goal.pos, 0.05); controls.target.lerp(goal.target, 0.05);
      if (camera.position.distanceTo(goal.pos) < 0.02) goal = null;
    }
    controls.update();
    const p = camera.position;
    ceiling.visible = p.y < H;
    walls.north.visible = p.x > -W / 2;
    walls.south.visible = p.x < W / 2;
    walls.front.visible = p.z < ZF + 0.2;
    walls.back.visible = p.z > ZB;
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
